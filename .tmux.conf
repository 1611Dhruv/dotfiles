# Prefix key
set-option -g prefix C-Space

# Enable mouse
set -g mouse on

# Split windows
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Switch panes using Alt + Arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vi mode in copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Don’t auto-rename windows
set-option -g allow-rename off

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'erikw/tmux-powerline'

# Ensure PATH includes Homebrew (important for pbcopy on macOS)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"

# Initialize TPM (keep this line at the bottom)
run '~/.tmux/plugins/tpm/tpm'
